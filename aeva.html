      (function () {
        var hostname = window.location.hostname;
        var isNonProduction =
          hostname.includes("dev.") ||
          hostname.includes("feature.") ||
          hostname.includes("staging.") ||
          hostname.includes("herokuapp.com") ||
          hostname.includes("localhost") ||
          hostname === "127.0.0.1";

        if (isNonProduction) {
          // Block all search engine indexing
          document.write(
            '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">',
          );
          document.write('<meta name="googlebot" content="noindex, nofollow">');
          document.write('<meta name="bingbot" content="noindex, nofollow">');

          // Add visual indicator in dev
          if (hostname.includes("dev.")) {
            document.title = "[DEV] " + document.title;
          } else if (hostname.includes("feature.")) {
            document.title = "[FEATURE] " + document.title;
          } else if (hostname === "localhost" || hostname === "127.0.0.1") {
            document.title = "[LOCAL] " + document.title;
          }
        }
      })();
